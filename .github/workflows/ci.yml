name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build tokless binary
        shell: bash
        run: |
          go build -o ./bin/ ./cmd/tokless
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Static Analysis
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...

      - name: Vulnerability Check
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: |
          npm install -g context-mode@latest @colbymchenry/codegraph
          go test -p 2 -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Ensure install.ps1 is ASCII-only (PS 5.1 safe)
        shell: bash
        run: |
          python3 -c "import sys; data=open('scripts/install.ps1','rb').read(); bad=[i+1 for i,l in enumerate(data.splitlines()) if any(b>127 for b in l)]; print('non-ASCII lines:', bad or 'NONE'); sys.exit(1 if bad else 0)"

      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @("scripts/install.ps1", "scripts/build-release.ps1")) {
            $errs = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$script", [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Output "$script parses OK"
          }
